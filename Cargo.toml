# Minimal Windows Reactor launcher manifest.
[package]
name = "windows-reactor-launcher"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-reactor = { path = "work/windows-rs/crates/libs/reactor" }

[dependencies.windows]
path = "work/windows-rs/crates/libs/windows"
features = [
    "combaseapi",
    "errhandlingapi",
    "knownfolders",
    "libloaderapi",
    "minwindef",
    "oaidl",
    "objbase",
    "objidl",
    "shellapi",
    "shlobj_core",
    "shobjidl_core",
    "shtypes",
    "stringapiset",
    "uiautomationclient",
    "uiautomationcore",
    "windef",
    "winerror",
    "winhttp",
    "winnt",
    "winuser",
    "wtypes",
    "wtypesbase",
]

[build-dependencies]
windows-reactor-setup = { path = "work/windows-rs/crates/libs/reactor-setup" }

[profile.release]
panic = "abort"
